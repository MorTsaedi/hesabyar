name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: build
          - os: macos-latest
            name: macos
            # Build one "universal" .app/.dmg that runs on both Intel and
            # Apple Silicon Macs (Tauri combines the two targets with lipo).
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: build --target universal-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # `npm run tauri build` also runs the configured `beforeBuildCommand`
      # (`npm run build`), so the frontend is built automatically first.
      - name: Build installers
        run: npm run tauri -- ${{ matrix.tauri_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle
          if-no-files-found: error

      - name: Attach installers to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
